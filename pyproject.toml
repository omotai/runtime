[project]
name = "omotai-runtime"
version = "0.0.1"
description = "Deterministic security runtime between AI agents and the browser."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "mcp>=2.2.0",
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.20.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
omotai = "omotai.runtime.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omotai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls a real LLM API; skipped in CI"]
pythonpath = ["tests"]
