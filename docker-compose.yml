version: '3.8'

services:
  omotai-ui:
    build:
      context: .
      dockerfile: src/omotai/dashboard/Dockerfile
    container_name: omotai-ui
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runs:/app/runs
    command: ["omotai", "start", "--dashboard", "--host", "0.0.0.0", "--port", "8080", "--policy", "/app/policy.yaml"]
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - OMOTAI_AGENT_KEY=dashboard-default-key
      - OMOTAI_ADMIN_TOKEN=${OMOTAI_ADMIN_TOKEN:?set OMOTAI_ADMIN_TOKEN (16+ characters) in .env}

  omotai-runtime:
    build:
      context: .
      dockerfile: src/omotai/runtime/Dockerfile
    container_name: omotai-runtime
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
    command: ["omotai", "start", "--mode", "sse", "--host", "0.0.0.0", "--port", "8000", "--policy", "/app/policy.yaml"]
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - OMOTAI_AGENT_KEY=dashboard-default-key
      - OMOTAI_ADMIN_TOKEN=${OMOTAI_ADMIN_TOKEN:?set OMOTAI_ADMIN_TOKEN (16+ characters) in .env}
